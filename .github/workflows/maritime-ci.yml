name: Maritime FPGA batch-UART integration and software demo
on:
  push:
    paths:
      - 'rtl/**'
      - 'tb/**'
      - 'host/**'
      - 'tests/**'
      - 'scripts/run_maritime_sim.sh'
      - '.github/workflows/maritime-ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python tools and RTL simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python -m pip install -q pytest numpy opencv-python-headless pyserial
      - name: Software numerical, protocol and synthetic shake regression
        run: |
          python host/design_coefficients.py
          python host/generate_vectors.py
          python -m pytest -q tests/test_fixed_point.py tests/test_serial_protocol.py tests/test_synthetic_maritime.py
      - name: Full UART packet, FIR, reset/recovery RTL regression
        run: bash scripts/run_maritime_sim.sh
      - name: Export software-only visual preview and validate quality target
        run: |
          python host/stabilize_video.py --out build/maritime_demo
          python - <<'PY'
          import json
          m=json.load(open('build/maritime_demo/metrics.json'))
          assert m['mode']=='SOFTWARE REFERENCE ONLY'
          assert m['pass_target_30pct']
          print('SOFTWARE_MARITIME_PREVIEW_PASS')
          PY
      - name: Keep preview video as software-only CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: maritime-software-reference-preview
          path: |
            build/maritime_demo/software_preview_before_after.mp4
            build/maritime_demo/metrics.json
          retention-days: 14
      - name: Evidence boundary
        if: always()
        run: |
          echo 'RTL and software CI are not Vivado implementation or physical FPGA evidence.'
