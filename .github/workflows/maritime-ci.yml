name: Maritime FPGA batch-UART integration and software demo
on:
  push:
    paths:
      - 'hardware/rtl/**'
      - 'hardware/sim/**'
      - 'host/**'
      - 'verification/**'
      - 'hardware/vivado/**'
      - 'hardware/build/maritime_a7.xpr'
      - '.github/workflows/maritime-ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python tools and RTL simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog ffmpeg xvfb
          python -m pip install -q pytest numpy opencv-python-headless pyserial matplotlib pillow imageio-ffmpeg
      - name: Software numerical, protocol and synthetic shake regression
        run: |
          python host/design_coefficients.py
          python host/design_audio_coefficients.py
          python host/generate_vectors.py
          python -m pytest -q verification/model/tests/test_fixed_point.py verification/system/tests/test_serial_protocol.py verification/system/tests/test_synthetic_maritime.py
      - name: Three-axis host geometry and GUI pipeline regression
        run: python -m pytest -q verification/system/tests/test_gui_pipeline.py verification/system/tests/test_natural_footage.py verification/system/tests/test_three_axis_v07.py verification/system/tests/test_long_media_v082.py verification/model/tests/test_audio_fir_v09.py verification/system/tests/test_unified_pipeline_v10.py verification/system/tests/test_maritime_adaptive_v11.py
      - name: Desktop video playback / replay regression
        run: xvfb-run -a python -m pytest -q verification/system/tests/test_gui_playback.py
      - name: FIR frequency response, integer extremes, and engineering summary
        run: |
          python verification/model/industrial_filter_assessment.py --no-plots
          python -m pytest -q verification/model/tests/test_engineering_assessment.py hardware/sim/checks verification/system/tests/test_release_validation_tools.py
          python host/engineering_summary.py
      - name: Dual coefficient-bank UART packet, FIR, reset/recovery RTL regression
        run: |
          bash hardware/sim/scripts/run_fir_sim.sh
          bash hardware/sim/scripts/run_maritime_sim.sh
      - name: Export software-only visual preview and validate quality target
        run: |
          python host/stabilize_video.py --out build/maritime_demo
          python - <<'PY'
          import json
          m=json.load(open('build/maritime_demo/metrics.json'))
          assert m['mode']=='SOFTWARE REFERENCE ONLY'
          assert m['pass_target_30pct']
          print('SOFTWARE_MARITIME_PREVIEW_PASS')
          PY
      - name: Keep preview video as software-only CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: maritime-software-reference-preview
          path: |
            build/maritime_demo/software_preview_before_after.mp4
            build/maritime_demo/metrics.json
          retention-days: 14
      - name: Evidence boundary
        if: always()
        run: |
          echo 'RTL and software CI are not Vivado implementation or physical FPGA evidence.'
