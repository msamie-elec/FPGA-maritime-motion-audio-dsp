name: FIR core reference and RTL simulation
on:
  push:
    paths:
      - 'rtl/**'
      - 'host/**'
      - 'tb/**'
      - 'tests/**'
      - 'scripts/run_fir_sim.sh'
      - '.github/workflows/fir-ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  fir-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Icarus and pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python -m pip install pytest
      - name: Generate vectors and run self-checking HDL regression
        run: bash scripts/run_fir_sim.sh
      - name: Note evidence limitations
        if: always()
        run: |
          echo 'This CI only verifies software reference tests and RTL simulation.'
          echo 'It does not prove Vivado timing or physical FPGA behaviour.'
